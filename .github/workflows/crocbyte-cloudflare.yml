name: crocbyte-cloudflare

# CrocByte on Cloudflare Workers (free plan) through OpenNext. Builds on Linux because the
# OpenNext bundler needs symlinks, which Windows refuses without Developer Mode.
# PR: build only (proves the Worker bundle builds and fits). Push to main: build + deploy,
# only once the Cloudflare secrets exist. Setup: apps/crocbyte/README.md.

on:
  pull_request:
    branches: [main]
    paths:
      [apps/crocbyte/**, packages/**, pnpm-lock.yaml, .github/workflows/crocbyte-cloudflare.yml]
  push:
    branches: [main]
    paths:
      [apps/crocbyte/**, packages/**, pnpm-lock.yaml, .github/workflows/crocbyte-cloudflare.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crocbyte-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Firebase web config is public by design (it ships to every browser); kept as repository
      # variables, not secrets. Access control lives in apps/crocbyte/firestore.rules.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.CROCBYTE_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.CROCBYTE_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.CROCBYTE_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.CROCBYTE_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.CROCBYTE_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.CROCBYTE_FIREBASE_APP_ID }}
      NEXT_PUBLIC_HUB_URL: ${{ vars.CROCBYTE_HUB_URL }}
      NEXT_PUBLIC_COOKIE_DOMAIN: ${{ vars.CROCBYTE_COOKIE_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @empire/crocbyte cf:build
      # free plan caps a Worker at 3 MiB gzipped; the dry run reports the real upload size
      - run: pnpm exec wrangler deploy --dry-run --outdir /tmp/worker
        working-directory: apps/crocbyte
      - name: deploy
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec opennextjs-cloudflare deploy
        working-directory: apps/crocbyte
