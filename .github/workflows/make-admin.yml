name: make-admin

# Makes an existing account a CMS admin on the real Supabase project (cms.admins).
# Run by hand: Actions → make-admin → Run workflow → the account's email. The account must have
# signed up at the hub first. The email is a run input, never committed (the repo is public).

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email of an account that already signed up at the hub
        required: true

permissions: {}

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: add to cms.admins
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EMAIL: ${{ inputs.email }}
        run: |
          echo "::add-mask::$EMAIL"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v email="$EMAIL" -tA <<'SQL'
          insert into cms.admins (user_id)
            select id from auth.users where lower(email) = lower(:'email')
          on conflict do nothing;
          select case when exists (
            select 1 from cms.admins a join auth.users u on u.id = a.user_id
            where lower(u.email) = lower(:'email')
          ) then 'admin: yes' else 'admin: NO - sign up at the hub first, then run again' end;
          SQL
