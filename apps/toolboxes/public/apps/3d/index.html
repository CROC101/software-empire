    <!-- The app works without crocwork (offline, blocked): a failed load only leaves out the account menu,

         System ▸ Network ▸ Allow Online Access off nothing is fetched. -->
    <script>
      (function () {
        var online = true;
        try {
          var p = JSON.parse(localStorage.getItem('p3d.preferences.v1') || 'null');
          online = !p || p.use_online_access !== false;
        } catch (e) {}
        if (!online) return;
        var s = document.createElement('script');
        s.src = '../crocwork-sdk.js?v=504f22dd';
        s.async = true;
        s.onerror = function () {
          window.__puterFailed = true;
        };
        // arriving after the app started: the top bar adds the account menu (src/ui/shell.ts)
        s.onload = function () {
          dispatchEvent(new Event('puter-loaded'));
        };
        document.head.appendChild(s);
      })();
    </script>
