name: "🎯 Feature (PM)"
description: งานใหม่ พร้อม acceptance criteria
title: "feat(<app>): "
labels: ["type:feature"]
body:
  - type: dropdown
    id: app
    attributes:
      label: แอป
      options:
        [
          hub,
          community,
          commerce,
          toolboxes,
          tarot,
          design,
          canva,
          stream,
          ui,
          core,
          config,
          standards,
        ]
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: ในฐานะ <ใคร> ฉันต้องการ <อะไร> เพื่อ <ประโยชน์>
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria (Definition of Done)
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p0, p1, p2]
  - type: textarea
    id: notes
    attributes:
      label: ข้อจำกัด / ลิงก์อ้างอิง
