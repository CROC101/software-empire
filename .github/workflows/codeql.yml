name: codeql

# GitHub's code scanning (free for public repos): JavaScript / TypeScript and the workflows
# themselves. Findings show under Security → Code scanning.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 20 * * 0" # Monday 03:23 in Bangkok, weekly

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results only
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # built third-party apps (HeyPuter/everything, minified, rebuilt by
          # apps/toolboxes/tools/everything.mjs); the shim and theme beside them stay scanned
          config: |
            paths-ignore:
              - apps/toolboxes/public/everything/*/**
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
