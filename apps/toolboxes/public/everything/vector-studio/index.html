  <script>
    // Apply the saved theme before first paint so there is no flash.
    (() => {
      let t = 'system';
      try { t = localStorage.getItem('vector-studio:theme') || 'system'; } catch {}
      const levels = ['dark', 'medium-dark', 'medium-light', 'light'];
      if (!levels.includes(t)) t = 'system';
      const dark = t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : t.endsWith('dark');
      const root = document.documentElement;
      root.dataset.theme = t;
      root.dataset.themeResolved = dark ? 'dark' : 'light';
      root.dataset.brightness = t === 'system' ? (dark ? 'dark' : 'light') : t;
    })();
  </script>
