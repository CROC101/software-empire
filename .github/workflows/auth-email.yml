name: auth-email

# Sends the sign-up / sign-in code emails from the real Supabase project:
# - the 6-digit-code templates in supabase/templates (config.toml only covers local)
# - the sender, when the SMTP_USER + SMTP_PASS secrets exist. Without them Supabase's built-in
#   sender delivers only to the project's own team, about 2 emails an hour.
# Run by hand after changing a template or the SMTP secrets: Actions → auth-email → Run workflow.
# Default SMTP host is Gmail (an App Password as SMTP_PASS); set vars SMTP_HOST / SMTP_PORT to
# use another provider.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: update auth email settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
        run: |
          set -euo pipefail
          body=$(jq -n \
            --rawfile signup supabase/templates/confirmation.html \
            --rawfile login supabase/templates/magic_link.html '{
              mailer_autoconfirm: false,
              mailer_otp_length: 6,
              mailer_otp_exp: 600,
              mailer_subjects_confirmation: "รหัสยืนยันสมัครสมาชิก crocwork.studio",
              mailer_templates_confirmation_content: $signup,
              mailer_subjects_magic_link: "รหัสเข้าสู่ระบบ crocwork.studio",
              mailer_templates_magic_link_content: $login
            }')
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            body=$(jq '. + {
                smtp_host: env.SMTP_HOST, smtp_port: env.SMTP_PORT,
                smtp_user: env.SMTP_USER, smtp_pass: env.SMTP_PASS,
                smtp_admin_email: env.SMTP_USER, smtp_sender_name: "crocwork.studio",
                smtp_max_frequency: 60, rate_limit_email_sent: 30
              }' <<<"$body")
            sender="SMTP $SMTP_HOST:$SMTP_PORT (30 emails/hour)"
          else
            sender="Supabase built-in (team members only, ~2/hour): add SMTP_USER + SMTP_PASS secrets"
          fi
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$body" -o /dev/null
          echo "templates: 6-digit code · sender: $sender" | tee -a "$GITHUB_STEP_SUMMARY"
