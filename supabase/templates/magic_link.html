<!doctype html>
<!-- crocwork email: inline hex because mail clients ignore CSS variables (values = @empire/ui
     palette: ink-975 #07060f, blue-600 #194fe3, sky-500 #069ce4, ink-100 #eeedf4) -->
<html lang="th">
  <body style="margin:0;padding:24px 12px;background:#eeedf4;font-family:'Noto Sans Thai',system-ui,sans-serif;color:#07060f">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:440px;margin:auto;border-collapse:collapse">
      <tr>
        <td style="background:#07060f;border-radius:12px 12px 0 0;padding:24px 28px;color:#ffffff">
          <p style="margin:0;font:700 12px/1 ui-monospace,monospace;text-transform:uppercase;color:#cac9d6">$ crocwork auth</p>
          <p style="margin:12px 0 0;font-size:24px;font-weight:900;line-height:1.3">รหัสเข้าสู่ระบบ<br /><span style="color:#069ce4">บัญชีเดียว ทุกระบบ</span></p>
        </td>
      </tr>
      <tr>
        <td style="background:#ffffff;border-radius:0 0 12px 12px;padding:28px;text-align:center">
          <p style="margin:0 0 16px;color:#55536a;font-size:14px">ใส่รหัส 6 หลักนี้ในหน้าเข้าสู่ระบบ</p>
          <p style="margin:0 0 20px;padding:16px 0;border:2px solid #194fe3;border-radius:10px;font:700 36px/1 ui-monospace,monospace;letter-spacing:10px;color:#194fe3">{{ .Token }}</p>
          <p style="margin:0;color:#55536a;font-size:13px;line-height:1.6">ใช้ได้ครั้งเดียว หมดอายุใน 10 นาที<br />ถ้าคุณไม่ได้ขอรหัสนี้ ไม่ต้องทำอะไร บัญชียังปลอดภัย</p>
        </td>
      </tr>
      <tr>
        <td style="padding:16px;text-align:center;color:#55536a;font-size:12px">crocwork.studio · ห้ามส่งรหัสนี้ให้ใคร ทีมงานไม่มีวันขอรหัสจากคุณ</td>
      </tr>
    </table>
  </body>
</html>
