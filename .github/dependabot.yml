# Weekly dependency updates, grouped so they arrive as a few PRs instead of dozens; each one must
# pass the same verify / deploy dry-run / database checks as any other PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Bangkok }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Asia/Bangkok }
    groups:
      actions:
        patterns: ["*"]
