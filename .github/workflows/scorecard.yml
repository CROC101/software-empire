name: scorecard

# OpenSSF Scorecard: the industry's supply-chain security check (pinned dependencies, token
# permissions, branch protection, code review, dangerous workflow patterns …). Results land in
# Security → Code scanning and on the public scorecard.dev page for this repo.

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 21 * * 1" # Tuesday 04:37 in Bangkok, weekly
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish results to the OpenSSF API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
