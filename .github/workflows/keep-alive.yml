name: keep-alive

# Supabase's free plan pauses a project after 7 days without requests. One small public read a
# day keeps it awake. Does nothing until SUPABASE_URL is set (docs/DEPLOY.md).

on:
  schedule:
    - cron: "17 3 * * *" # 10:17 in Bangkok, daily
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: read one public row
        if: env.SUPABASE_URL != ''
        run: |
          # the CMS table is public by design; one key, no data needed back
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Accept-Profile: cms" \
            "$SUPABASE_URL/rest/v1/entries?select=key&limit=1" > /dev/null
          echo "awake"
